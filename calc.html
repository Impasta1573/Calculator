<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
    padding: 16px;
  }
  .calculator {
    width: 100%;
    max-width: 340px;
    padding: 20px;
    border-radius: 18px;
    background: #222;
    box-shadow: 0 10px 35px #0009;
  }
  h2 {
    text-align: center;
    font-size: 19px;
    margin: 0 0 16px;
  }
  #display {
    width: 100%;
    min-height: 65px;
    padding: 14px 10px;
    margin-bottom: 12px;
    border: 2px solid #444;
    border-radius: 10px;
    background: #090909;
    color: #8cff8c;
    font-size: 25px;
    text-align: right;
    overflow-wrap: anywhere;
    overflow: hidden;
  }
  #status {
    min-height: 20px;
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  button {
    min-width: 0;
    min-height: 55px;
    border: none;
    border-radius: 10px;
    background: #3a3a3a;
    color: white;
    font-size: 21px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background 0.1s, transform 0.1s;
  }
  button:active {
    transform: scale(0.96);
    background: #666;
  }
  .operator { background: #b76b24; }
  .clear { background: #a93232; }
  .equals {
    width: 100%;
    margin-top: 9px;
    background: #236c45;
  }
  #fish {
    display: none;
    width: 100%;
    margin-top: 10px;
    background: #1c526e;
    font-size: 20px;
  }
  #scare {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #scare img {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #scareText {
    position: absolute;
    bottom: 12px;
    color: white;
    font-size: 13px;
    text-shadow: 0 0 5px black;
  }
  .footer {
    margin-top: 13px;
    color: #777;
    font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="calculator">
  <h2>Calculator</h2>
  <div id="display" aria-live="polite">0</div>
  <div id="status">Ready to calculate.</div>
  <div class="keypad">
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="0">0</button>
    <button class="operator" data-key="+">+</button>
    <button class="clear" data-key="C">C</button>
  </div>
  <button class="equals" id="equals">=</button>
  <button id="fish">FISH</button>
  <div class="footer">Accuracy guaranteed.</div>
</div>
<div id="scare" role="dialog" aria-label="Surprise">
  <img id="scareImage" src="jumpscare.jpeg" alt="Jumpscare"
       onerror="this.style.display='none'">
  <div id="scareText">lol</div>
</div>
<audio id="scareSound" src="jumpscare.mp3" preload="auto"></audio>
<audio id="fishSound" src="fish.mp3" preload="auto"></audio>
    <audio id="secretherbsandspices" src="secretherbsandspices.mp3" preload="auto"></audio>
<script>
(() => {
  "use strict";
  const display = document.getElementById("display");
  const status = document.getElementById("status");
  const equals = document.getElementById("equals");
  const fishButton = document.getElementById("fish");
  const scare = document.getElementById("scare");
  const scareImage = document.getElementById("scareImage");
  const scareSound = document.getElementById("scareSound");
  const fishSound = document.getElementById("fishSound");
  let first = "";
  let second = "";
  let operatorPressed = false;
  let finished = false;
  let crashed = false;
  let lastButton = "";
  let scareActive = false;
  const PRIME_DIGITS = ["2", "3", "5", "7"];
  function updateDisplay(value) {
    display.textContent = String(value);
  }
  function setStatus(value) {
    status.textContent = value;
  }
  function crash(){
        crashed = true;
        document.documentElement.innerHTML = "";
        document.open();
        document.write("");
        document.close();
  }
  function clearCalculator() {
    first = "";
    second = "";
    operatorPressed = false;
    finished = false;
    lastButton = "";
    updateDisplay("0");
    setStatus("Ready to calculate.");
    fishButton.style.display = "none";
  }
  let rs = 0;
  function pressDigit(originalDigit) {
    if (crashed || scareActive) return;
    if (Math.random() < 0.01337){
        playAudio(secretherbsandspices)
    }
    if ((lastButton === "6" && originalDigit === "7")) {
      crash();
      return;
    }
    lastButton = originalDigit;
    let digit = originalDigit;
    if ((first + "+" + second).includes("67")){
        crash();
        return;
    }
    if ((digit === "8" || digit === "9") &&
        Math.random() < 0.085) {
      digit = digit === "8" ? "9" : "8";
    }
    if (finished) {
      clearCalculator();
      lastButton = originalDigit;
    }
    if (!operatorPressed) {
      if (first.length >= 15) return;
      first += digit;
      updateDisplay(first);
      return;
    }
    if (second.length >= 15) return;
    second += digit;
    updateDisplay(first + "+" + second);
  }
  function pressPlus() {
    if (crashed || scareActive || finished) return;
    if (!first || operatorPressed) return;
    operatorPressed = true;
    lastButton = "+";
    updateDisplay(first + "+");
    setStatus("Enter the second number.");
  }
  function isPrimeDigit(digit) {
    return PRIME_DIGITS.includes(digit);
  }
  function hasPrimeDigit(number) {
    return [...number].some(isPrimeDigit);
  }
  function endsInZero(number) {
    return number.endsWith("0");
  }
  function hasPrimeSecondLastDigit(number) {
    if (number.length < 2) return false;
    return isPrimeDigit(number[number.length - 2]);
  }
  function startsWithFour(number) {
    return number.startsWith("4");
  }
  const digitWords = [
    "zero", "one", "two", "three", "four",
    "five", "six", "seven", "eight", "nine"
  ];
  function alphabeticalDigitWordResult(a, b) {
    const digits = [...String(a + b)];
    const words = digits.map(d => digitWords[Number(d)]);
    words.sort((x, y) => x.localeCompare(y));
    return words.join("");
  }
  function playAudio(audio) {
    audio.currentTime = 0;
    const promise = audio.play();
    if (promise && typeof promise.catch === "function") {
      promise.catch(() => {
       let lol = 69;
      });
    }
  }
  function triggerScare() {
    scareActive = true;
    scare.style.display = "flex";
    scareImage.style.display = "";
    playAudio(scareSound);
  }
  function dismissScare() {
    scare.style.display = "none";
    scareActive = false;
    scareSound.pause();
    scareSound.currentTime = 0;
    clearCalculator();
  }
  scare.addEventListener("click", dismissScare);
  function calculate() {
    if (crashed || scareActive) return;
    if ((first + "+" + second).includes("67") || (first + "+" + second).includes("6+7")){
        crash();
        return;
    }
    if (!first || !operatorPressed || !second) {
      setStatus("Enter two numbers first.");
      return;
    }
    const a = Number(first);
    const b = Number(second);
    const sum = a + b;
    let result;
    let fishResult = false;
    let reason = "";
    if (a === 2 && b === 2) {
      result = "FISH";
      fishResult = true;
      reason = "";
    }
    else if (b % 13 === 0) {
      result = "JESUS";
      reason = "";
    }
    else if (startsWithFour(second)) {
      result = alphabeticalDigitWordResult(a + 13, b + 37);
      reason = "";
    }
    else if (sum % 6 === 0) {
      result = Math.floor(sum).toString(9);
      reason = "";
    }
    else if (endsInZero(first)) {
      result = hasPrimeSecondLastDigit(first)
        ? sum - 10
        : sum + 10;
      reason = "";
    }
    else if (endsInZero(second)) {
      result = hasPrimeSecondLastDigit(second)
        ? sum - 10
        : sum + 10;
      reason = "";
    }
    else if (
      Number(first[0]) % Number(second[0]) === 0
    ) {
      result = "IDK";
      reason = "";
    }
    else {
      result = first + second;
      reason = "";
    }
    if (parseFloat(result) === sum){
        if (result % 2 === 0){
            result++;
        } else {
            result--;
        }
    }
    finished = true;
    updateDisplay(result);
    setStatus(reason);
    fishButton.style.display = fishResult ? "block" : "none";
    if (String(result).includes("15")) {
      triggerScare();
    }
  }
  document.querySelectorAll("[data-key]").forEach(button => {
    button.addEventListener("click", () => {
      const key = button.dataset.key;
      if (key === "C") {
        if (!crashed && !scareActive) clearCalculator();
      } else if (key === "+") {
        pressPlus();
      } else {
        pressDigit(key);
      }
    });
  });
  equals.addEventListener("click", calculate);
  fishButton.addEventListener("click", () => {
    if (crashed || scareActive) return;
    playAudio(fishSound);
  });
  document.addEventListener("keydown", event => {
    event.preventDefault();
  });
  clearCalculator();
})();
</script>
</body>
</html>
